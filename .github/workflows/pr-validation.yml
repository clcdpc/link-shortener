name: PR validation

on:
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  validate:
    name: Build, test, and publish
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      APP_PROJECT: src/LinkShortener.csproj

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore LinkShortener.sln

      - name: Build
        run: dotnet build LinkShortener.sln --configuration Release --no-restore

      # xUnit reports SQL tests as skipped without LINK_SHORTENER_TEST_SQL.
      - name: Test
        run: dotnet test LinkShortener.sln --configuration Release --no-build --logger "console;verbosity=normal"

      - name: Verify publish
        shell: pwsh
        run: |
          # Exercise the exclusions on a clean runner with synthetic operational files.
          '{}' | Set-Content src/config/application.json
          '{}' | Set-Content src/config/settings.json
          dotnet publish "$env:APP_PROJECT" --configuration Release --no-build --output artifacts/publish
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $output = 'artifacts/publish'
          $example = Join-Path $output 'config/example.json'
          if (!(Test-Path -LiteralPath $example -PathType Leaf)) { throw 'Missing configuration example.' }
          if ((Get-FileHash $example).Hash -ne (Get-FileHash 'src/config/example.json').Hash) { throw 'Unexpected example contents.' }
          if (@(Get-ChildItem "$output/config" -File -Recurse).Count -ne 1) { throw 'Unexpected published configuration.' }
          if (Get-ChildItem $output -Recurse -File -Include application.json,settings*.json,appsettings*.json,key-*.xml,*.log) {
            throw 'Operational files found in publish output.'
          }
